[package]
name = "wifinx-validator"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:tray-icon", "dep:gtk", "dep:directories", "dep:serde", "dep:serde_json"]

[dependencies]
tray-icon = { version = "0.21", optional = true, default-features = false }
directories = { version = "6", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
eframe = { version = "0.37", optional = true, default-features = false, features = ["wgpu", "default_fonts"] }

[target.'cfg(target_os = "macos")'.dependencies]
eframe = { version = "0.37", optional = true, default-features = false, features = ["wgpu", "default_fonts"] }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37", optional = true, default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
gtk = { version = "0.18", optional = true }

[[bin]]
name = "wifinx-validator"
path = "src/main.rs"
required-features = ["desktop"]

[profile.release]
strip = true
